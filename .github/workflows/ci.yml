name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Package .vsix
        # `npx --yes` fetches @vscode/vsce on demand. We don't add it to
        # devDependencies to keep `npm ci` lean for everyone else.
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: saltstack-toolkit-vsix
          path: "*.vsix"
          retention-days: 30
